spring.application.name=bookmark-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmark_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${BOOKMARK_DB_USERNAME}
spring.datasource.password=${BOOKMARK_DB_PASSWORD}
spring.main.allow-bean-definition-overriding=true
spring.mvc.hidden-method.filter.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
bookmark.avatar.storage-directory=${AVATAR_UPLOAD_DIR:uploads/avatars}
# ==============================
# JWT 設定
# ==============================

# JWT Secret Key（使用 Base64 編碼的隨機金鑰）
jwt.secret=${BOOKMARK_JWT_SECRET}

# Access Token 有效期限：15 分鐘
jwt.access-token-expiration=900000

# Refresh Token 有效期限：30 天
jwt.refresh-token-expiration=2592000000

# ==============================
# Email 設定
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 驗證碼有效期限：10 分鐘
auth.email-verification-expiration=600000
