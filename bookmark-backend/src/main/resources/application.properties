spring.application.name=bookmark-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmark_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${BOOKMARK_DB_USERNAME}
spring.datasource.password=${BOOKMARK_DB_PASSWORD}
spring.main.allow-bean-definition-overriding=true
spring.mvc.hidden-method.filter.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
bookmark.avatar.storage-directory=${AVATAR_UPLOAD_DIR:uploads/avatars}
# ==============================
# JWT 設定
# ==============================

# JWT Secret Key（使用 Base64 編碼的隨機金鑰）
jwt.secret=${BOOKMARK_JWT_SECRET}

# Access Token 有效期限：15 分鐘
jwt.access-token-expiration=900000

# Refresh Token 有效期限（毫秒），0 表示有效至撤銷
jwt.refresh-token-expiration=0

# Google OAuth Web Client ID（與 Android 使用同一個值）
bookmark.google.client-id=${GOOGLE_WEB_CLIENT_ID:}

# ==============================
# Email 設定
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Database tables are managed manually in MySQL; do not run startup SQL scripts.
spring.sql.init.mode=never
